<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JOY CRICKET WORLD</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#073b25;color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center;padding:10px;touch-action:manipulation}.game{width:min(100%,560px);background:#092b20;border:2px solid #ffffff44;border-radius:18px;padding:12px}h1{text-align:center;font-size:24px;margin:4px 0 10px}.score{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.score div{background:#102a43;border-radius:9px;text-align:center;padding:6px;font-size:12px}.score b{display:block;color:#ffe066;font-size:19px;margin-top:3px}.stage{position:relative;margin-top:10px;border:3px solid #fff;border-radius:12px;overflow:hidden}canvas{display:block;width:100%;height:auto}.timing{position:absolute;right:8px;top:10px;width:145px;background:#092b20ee;border:1px solid #fff;border-radius:8px;padding:7px;text-align:center;font-size:10px;z-index:2}.bar{display:grid;grid-template-columns:repeat(5,1fr);height:14px;margin-top:5px;border:1px solid #fff}.bar span:nth-child(1),.bar span:nth-child(5){background:#e76f51}.bar span:nth-child(2),.bar span:nth-child(4){background:#f4a261}.bar span:nth-child(3){background:#2a9d8f}.marker{height:4px;background:#ffe066;margin-top:5px;position:relative}.marker:after{content:"";position:absolute;width:4px;height:12px;background:#fff;left:var(--marker,50%);top:-4px}.message{text-align:center;color:#ffe066;font-weight:bold;min-height:40px;padding:8px 2px;font-size:16px}.directions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}button{min-height:52px;border:0;border-radius:11px;background:#d8f3dc;color:#092b20;font-weight:bold;font-size:13px;padding:8px;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:4px solid #ffe066;outline-offset:2px}button:active{transform:scale(.97)}button.selected{background:#ffe066;outline:3px solid #fff}.bottom{margin-top:8px}.reset{width:100%;background:#f8f9fa}.help{text-align:center;font-size:12px;color:#d8f3dc;line-height:1.5;margin-top:9px}@media(max-width:360px){.timing{width:118px;font-size:8px}.message{font-size:14px}button{font-size:11px;padding:5px}}
</style>
</head>
<body>
<main class="game" aria-labelledby="game-title">
<h1 id="game-title">🏏 JOY CRICKET WORLD</h1>
<div class="score" aria-label="Game score"><div>Runs<b id="runs" aria-live="polite">0</b></div><div>Wickets<b id="wickets" aria-live="polite">0/3</b></div><div>Target<b id="target">20</b></div><div>Level<b id="level">1</b></div></div>
<div class="stage"><canvas id="canvas" width="420" height="640" role="img" aria-label="Animated cricket pitch showing the bowler, ball and batsman"></canvas><div class="timing" aria-label="Swing timing guide"><div>SWING TIMING</div><div>EARLY · GOOD · PERFECT · GOOD · LATE</div><div class="bar" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div><div class="marker" id="marker"></div></div></div>
<div class="message" id="message" role="status" aria-live="polite">Ball coming. Tap when the ball reaches the yellow circle.</div>
<div class="directions" aria-label="Shot direction controls"><button type="button" data-shot="left" aria-label="Play front left shot">↙ Front Left</button><button type="button" data-shot="straight" aria-label="Play straight shot">⬇ Straight</button><button type="button" data-shot="right" aria-label="Play front right shot">↘ Front Right</button></div>
<div class="bottom"><button type="button" class="reset" id="reset">↻ Reset Game</button></div>
<div class="help">Choose a direction only when the ball is near the yellow contact circle. PC: Left Arrow, Down Arrow, Right Arrow.</div>
</main>
<script>
'use strict';
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height,$=id=>document.getElementById(id);
const CONTACT={x:W/2,y:500,radius:43},speeds={1:180,2:220,3:260,4:300,5:340};
const initialGame=()=>({runs:0,wickets:0,target:20,level:1,direction:'straight',phase:'incoming',ball:{x:CONTACT.x,y:95,r:10},swing:{active:false,progress:0,direction:'straight'},hitChecked:false,impact:null,next:0,last:0,over:false});
let game=initialGame();
function message(text){$('message').textContent=text}
function score(){$('runs').textContent=game.runs;$('wickets').textContent=game.wickets+'/3';$('target').textContent=game.target;$('level').textContent=game.level}
function speed(){return speeds[Math.min(game.level,5)]||340}
function clearSelection(){document.querySelectorAll('[data-shot]').forEach(b=>b.classList.remove('selected'))}
function startDelivery(){if(game.over)return;game.phase='incoming';game.hitChecked=false;game.impact=null;game.next=0;game.ball={x:CONTACT.x,y:95,r:10};game.swing={active:false,progress:0,direction:game.direction};clearSelection();message('Ball coming. Tap when it reaches the yellow circle.')}
function selectShot(direction){if(game.phase!=='incoming'||game.hitChecked||game.over)return;game.direction=direction;game.swing={active:true,progress:0,direction};document.querySelectorAll('[data-shot]').forEach(b=>b.classList.toggle('selected',b.dataset.shot===direction));resolveShot()}
document.querySelectorAll('[data-shot]').forEach(b=>b.addEventListener('click',()=>selectShot(b.dataset.shot)));
document.addEventListener('keydown',e=>{const map={ArrowLeft:'left',ArrowDown:'straight',ArrowRight:'right'};if(map[e.key]){e.preventDefault();selectShot(map[e.key])}});
$('reset').addEventListener('click',()=>{game=initialGame();score();startDelivery()});
function timing(){const d=game.ball.y-CONTACT.y;if(Math.abs(d)<=14)return'perfect';if(Math.abs(d)<=43)return'good';return d<0?'early':'late'}
function resolveShot(){if(game.hitChecked)return;game.hitChecked=true;const result=timing();if(result==='perfect'){game.runs+=6;message('PERFECT HIT! +6 RUNS');impact();finish(true)}else if(result==='good'){const runs=Math.random()<.5?2:4;game.runs+=runs;message('GOOD TIMING! +'+runs+' RUNS');impact();finish(true)}else{game.wickets++;message(result==='early'?'TOO EARLY! Wicket lost.':'TOO LATE! Wicket lost.');finish(false)}score()}
function impact(){game.impact={x:game.ball.x,y:game.ball.y,time:performance.now()}}
function completeLevel(){game.level++;game.target+=20;message('LEVEL COMPLETE! Level '+game.level+' — bowling is faster.');score()}
function finish(success){game.phase=success?'outgoing':'missed';if(game.runs>=game.target)completeLevel();if(game.wickets>=3){game.over=true;game.phase='over';message('INNINGS OVER! Final score: '+game.runs+'. Press Reset Game to play again.');return}game.next=success?1000:1200}
function drawPitch(){ctx.fillStyle='#168447';ctx.fillRect(0,0,W,H);for(let y=0;y<H;y+=48){ctx.fillStyle=y%96===0?'#ffffff08':'#00000008';ctx.fillRect(0,y,W,48)}ctx.fillStyle='#c99b63';ctx.fillRect(86,35,248,565);ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(70,126);ctx.lineTo(350,126);ctx.moveTo(70,512);ctx.lineTo(350,512);ctx.stroke();ctx.strokeStyle='#ffe06699';ctx.lineWidth=2;ctx.setLineDash([6,6]);ctx.beginPath();ctx.arc(CONTACT.x,CONTACT.y,CONTACT.radius,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);drawBowler(W/2,78)}
function drawBowler(x,y){ctx.save();ctx.translate(x,y);ctx.fillStyle='#23395d';ctx.beginPath();ctx.arc(0,-14,13,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f2c6a0';ctx.beginPath();ctx.arc(0,-15,8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#23395d';ctx.fillRect(-13,0,26,32);ctx.strokeStyle='#f2c6a0';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-9,5);ctx.lineTo(-25,20);ctx.moveTo(9,5);ctx.lineTo(25,20);ctx.stroke();ctx.fillStyle='#172b4d';ctx.fillRect(-12,30,9,22);ctx.fillRect(3,30,9,22);ctx.restore()}
function shotAngle(){return game.swing.direction==='left'?-0.75:game.swing.direction==='right'?0.75:0}
function drawBatsman(){const x=CONTACT.x,y=558;ctx.save();ctx.translate(x,y);ctx.strokeStyle='#172b4d';ctx.lineWidth=13;ctx.beginPath();ctx.moveTo(-10,35);ctx.lineTo(-22,78);ctx.moveTo(10,35);ctx.lineTo(22,78);ctx.stroke();ctx.fillStyle='#f1f5f9';ctx.fillRect(-35,20,22,49);ctx.fillRect(13,20,22,49);ctx.fillStyle='#2563eb';ctx.fillRect(-27,-35,54,65);ctx.fillStyle='#f2c6a0';ctx.beginPath();ctx.arc(0,-58,20,0,Math.PI*2);ctx.fill();ctx.fillStyle='#172b4d';ctx.beginPath();ctx.arc(0,-65,22,Math.PI,Math.PI*2);ctx.fill();ctx.fillRect(-22,-65,44,7);ctx.strokeStyle='#f2c6a0';ctx.lineWidth=11;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-18,-20);ctx.lineTo(31,-3);ctx.moveTo(18,-20);ctx.lineTo(34,7);ctx.stroke();let a=-0.18;if(game.swing.active)a=-0.18+Math.sin(Math.min(1,game.swing.progress)*Math.PI)*shotAngle();ctx.save();ctx.translate(33,1);ctx.rotate(a);ctx.fillStyle='#6b4226';ctx.fillRect(-5,-55,10,57);ctx.fillStyle='#f3d18b';ctx.strokeStyle='#7c4a21';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(-15,-185,30,132,5);ctx.fill();ctx.stroke();ctx.fillStyle='#ffffff55';ctx.fillRect(-8,-174,16,110);ctx.restore();ctx.fillStyle='#f2c6a0';ctx.beginPath();ctx.arc(31,-3,8,0,Math.PI*2);ctx.arc(34,7,8,0,Math.PI*2);ctx.fill();ctx.restore()}
function drawBall(){const b=game.ball;ctx.save();ctx.translate(b.x,b.y);ctx.fillStyle='#0003';ctx.beginPath();ctx.ellipse(5,7,13,6,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#d62828';ctx.beginPath();ctx.arc(0,0,b.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,0,6,-.7,.7);ctx.stroke();ctx.restore()}
function drawImpact(){if(!game.impact)return;const p=Math.min(1,(performance.now()-game.impact.time)/420);ctx.save();ctx.globalAlpha=1-p;ctx.strokeStyle='#ffe066';ctx.lineWidth=5;ctx.beginPath();ctx.arc(game.impact.x,game.impact.y,12+p*34,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 18px Arial';ctx.textAlign='center';ctx.fillText('CONTACT!',game.impact.x,game.impact.y-25);ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);drawPitch();drawBatsman();drawBall();drawImpact()}
function update(dt){if(game.over)return;if(game.swing.active){game.swing.progress=Math.min(1,game.swing.progress+dt/260);if(game.swing.progress>=1&&game.phase!=='incoming')game.swing.active=false}if(game.phase==='incoming'){game.ball.y+=speed()*dt/1000;if(game.ball.y>CONTACT.y+75&&!game.hitChecked){game.hitChecked=true;game.wickets++;message('MISS! The ball passed the bat.');finish(false);score()}}else if(game.phase==='outgoing'){const dx=game.direction==='left'?-1.8:game.direction==='right'?1.8:0;game.ball.x+=dx*speed()*dt/1000;game.ball.y-=speed()*1.2*dt/1000}else if(game.phase==='missed'){game.ball.y+=speed()*dt/1000}if(game.next>0){game.next-=dt;if(game.next<=0&&!game.over)startDelivery()}const pct=Math.max(0,Math.min(100,(game.ball.y/CONTACT.y)*100));$('marker').style.setProperty('--marker',pct+'%')}
function loop(now){if(!game.last)game.last=now;const dt=Math.min(40,now-game.last);game.last=now;update(dt);draw();requestAnimationFrame(loop)}
score();startDelivery();requestAnimationFrame(loop);
</script>
</body>
</html>
