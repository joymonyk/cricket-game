<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>JOY CRICKET WORLD</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#06351f;color:white;font-family:Arial;display:flex;justify-content:center;align-items:center;padding:6px}.game{width:min(100%,560px);max-height:100dvh;overflow:hidden;background:#092b20;border:2px solid #ffffff44;border-radius:16px;padding:8px}h1{text-align:center;font-size:clamp(18px,4.5vw,26px);margin:2px 0 6px}.score{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.score div{background:#102a43;border-radius:7px;text-align:center;padding:3px;font-size:10px}.score b{display:block;color:#ffe066;font-size:16px}.stage{position:relative;margin-top:6px;border:2px solid white;border-radius:10px;overflow:hidden}.stage canvas{display:block;width:100%;height:auto;max-height:52dvh;object-fit:contain}.timing{position:absolute;right:5px;top:5px;background:#092b20ed;border:1px solid white;border-radius:7px;padding:4px;font-size:9px}.message{text-align:center;color:#ffe066;font-weight:bold;min-height:28px;padding:4px;font-size:12px}.controls{display:grid;gap:5px}.directions{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}button{min-height:38px;border:0;border-radius:8px;background:#d8f3dc;color:#092b20;font-weight:bold;font-size:12px;cursor:pointer}button:disabled{opacity:.4}.bowl{background:#ffcf33}.reset{background:white}.celebrate{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:54px;font-weight:900;color:#ffe066;text-shadow:3px 3px #8b1e3f;pointer-events:none;opacity:0}.celebrate.show{animation:cheer 1s ease-out}@keyframes cheer{0%{opacity:0;transform:scale(.5)}25%,75%{opacity:1;transform:scale(1.1)}100%{opacity:0;transform:scale(1.3)}}.help{text-align:center;font-size:9px;color:#d8f3dc;margin-top:5px}</style></head><body><main class="game"><h1>🏏 JOY CRICKET WORLD</h1><div class="score"><div>Runs<b id="runs">0</b></div><div>Wickets<b id="wickets">0/3</b></div><div>Target<b id="target">20</b></div><div>Level<b id="level">1</b></div></div><div class="stage"><canvas id="canvas" width="420" height="480" aria-label="Cricket pitch"></canvas><div class="timing">EARLY · GOOD · PERFECT · GOOD · LATE</div><div id="celebrate" class="celebrate"></div></div><div id="message" class="message">Press BOWL to start.</div><div class="controls"><button id="bowl" class="bowl">🏏 BOWL / START DELIVERY</button><div class="directions"><button data-shot="left" disabled>↙ LEFT</button><button data-shot="straight" disabled>⬆ CENTER</button><button data-shot="right" disabled>↘ RIGHT</button></div><button id="reset" class="reset">↻ RESET GAME</button></div><div class="help">Tap LEFT, CENTER or RIGHT while the ball is approaching.</div></main><script>'use strict';const c=document.getElementById('canvas'),x=c.getContext('2d'),W=420,H=480,$=id=>document.getElementById(id),contact={x:210,y:135};let g,delivery=0,last=0;const fresh=()=>({runs:0,wickets:0,target:20,level:1,phase:'ready',ball:{x:210,y:385,r:10},startX:210,targetX:210,shot:'straight',next:0,over:false});g=fresh();function score(){$('runs').textContent=g.runs;$('wickets').textContent=g.wickets+'/3';$('target').textContent=g.target;$('level').textContent=g.level}function msg(t){$('message').textContent=t}function shotButtons(v){document.querySelectorAll('[data-shot]').forEach(b=>b.disabled=!v)}function clearSelect(){document.querySelectorAll('[data-shot]').forEach(b=>b.classList.remove('selected'))}function bowl(){if(g.over||g.phase==='incoming')return;delivery++;const lane=delivery%3;g.startX=lane===1?85:lane===2?335:210;g.targetX=lane===1?170:lane===2?250:210;g.ball={x:g.startX,y:385,r:10};g.phase='incoming';g.next=0;clearSelect();shotButtons(true);msg(lane===1?'LEFT-SIDE DELIVERY! Tap your shot.':lane===2?'RIGHT-SIDE DELIVERY! Tap your shot.':'CENTER DELIVERY! Tap your shot.')}function timing(){const d=g.ball.y-contact.y;if(Math.abs(d)<=25)return'perfect';if(Math.abs(d)<=55)return'good';return d<0?'early':'late'}function hit(dir){if(g.phase!=='incoming'||g.over)return;g.shot=dir;g.phase='result';shotButtons(false);const t=timing();let r=t==='perfect'?[4,6,6,6,3][Math.floor(Math.random()*5)]:t==='good'?[0,1,2,3,4][Math.floor(Math.random()*5)]:[0,0,1,2][Math.floor(Math.random()*4)];if((t==='early'||t==='late')&&Math.random()<.35){g.wickets++;msg(t.toUpperCase()+'! WICKET LOST.')}else{g.runs+=r;msg(t.toUpperCase()+' TIMING: +'+r+' RUNS');if(r===4||r===6){$('celebrate').textContent=r===6?'SIX! 🎉':'FOUR! 🎉';$('celebrate').className='celebrate show'}}finish();score()}function finish(){if(g.runs>=g.target){g.level++;g.target+=20;msg('LEVEL COMPLETE! Level '+g.level)}if(g.wickets>=3){g.over=true;g.phase='over';msg('INNINGS OVER! Press RESET.');return}g.next=900}document.querySelectorAll('[data-shot]').forEach(b=>b.addEventListener('click',()=>hit(b.dataset.shot)));$('bowl').addEventListener('click',bowl);$('reset').addEventListener('click',()=>{g=fresh();delivery=0;shotButtons(false);clearSelect();$('celebrate').className='celebrate';score();msg('Press BOWL to start.')});document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='b')bowl();const m={ArrowLeft:'left',ArrowUp:'straight',ArrowRight:'right'};if(m[e.key])hit(m[e.key])});function pitch(){x.fillStyle='#168447';x.fillRect(0,0,W,H);x.fillStyle='#c99b63';x.fillRect(86,20,248,440);x.strokeStyle='white';x.lineWidth=3;x.strokeRect(70,70,280,350);x.strokeStyle='#ffe066';x.setLineDash([6,6]);x.beginPath();x.arc(210,135,35,0,Math.PI*2);x.stroke();x.setLineDash([])}function person(){x.fillStyle='#2563eb';x.fillRect(183,38,54,55);x.fillStyle='#f2c6a0';x.beginPath();x.arc(210,28,12,0,7);x.fill();x.fillStyle='#172b4d';x.fillRect(190,88,12,30);x.fillRect(218,88,12,30);x.fillStyle='#183b70';x.fillRect(196,365,28,40);x.fillStyle='#f2c6a0';x.beginPath();x.arc(210,350,12,0,7);x.fill();x.fillStyle='#f3d18b';x.fillRect(158,245,22,105)}function ball(){x.fillStyle='#d62828';x.beginPath();x.arc(g.ball.x,g.ball.y,g.ball.r,0,7);x.fill();x.strokeStyle='white';x.stroke()}function draw(){x.clearRect(0,0,W,H);pitch();person();ball()}function update(dt){if(g.phase==='incoming'){const progress=(385-g.ball.y)/250;g.ball.y-=(155+g.level*25)*dt/1000;g.ball.x=g.startX+(g.targetX-g.startX)*Math.min(1,progress);if(g.ball.y<55){g.wickets++;g.phase='result';shotButtons(false);msg('MISSED BALL! WICKET LOST.');finish();score()}}else if(g.phase==='result'){g.ball.y+=200*dt/1000;g.ball.x+=(g.shot==='left'?-1:g.shot==='right'?1:0)*200*dt/1000}if(g.next>0){g.next-=dt;if(g.next<=0&&!g.over){g.phase='ready';msg('Press BOWL for the next delivery.')}}}function loop(now){const dt=Math.min(40,last?now-last:16);last=now;update(dt);draw();requestAnimationFrame(loop)}score();shotButtons(false);requestAnimationFrame(loop);</script></body></html>
