<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Auto Shot Cricket</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#073b25;font-family:Arial,sans-serif;color:#fff;display:flex;justify-content:center;padding:10px;touch-action:manipulation}
.game{width:min(100%,560px);background:#092b20;border:2px solid #ffffff44;border-radius:18px;padding:12px}
h1{text-align:center;font-size:24px;margin:4px 0 10px}
.score{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.score div{background:#102a43;border-radius:9px;text-align:center;padding:6px;font-size:12px}
.score b{display:block;color:#ffe066;font-size:19px;margin-top:3px}
.stage{position:relative;margin-top:10px;border:3px solid white;border-radius:12px;overflow:hidden}
canvas{display:block;width:100%;height:auto}
.timing{position:absolute;right:8px;top:10px;width:115px;background:#092b20dd;border:1px solid #fff;border-radius:8px;padding:6px;text-align:center;font-size:9px;z-index:2}
.timing .bar{display:grid;grid-template-columns:repeat(5,1fr);height:12px;margin-top:5px;border:1px solid white}
.timing span:nth-child(1),.timing span:nth-child(5){background:#e76f51}
.timing span:nth-child(2),.timing span:nth-child(4){background:#f4a261}
.timing span:nth-child(3){background:#2a9d8f}
.timing .marker{height:4px;background:#ffe066;margin-top:4px;position:relative}
.timing .marker:after{content:"";position:absolute;width:4px;height:12px;background:#fff;left:var(--marker,50%);top:-4px}
.message{text-align:center;color:#ffe066;font-weight:bold;min-height:36px;padding:8px 2px;font-size:16px}
.directions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
button{min-height:52px;border:0;border-radius:11px;background:#d8f3dc;color:#092b20;font-weight:bold;font-size:13px;padding:8px;cursor:pointer}
button:active{transform:scale(.97)}
button.selected{background:#ffe066;outline:3px solid white}
.bottom{display:grid;grid-template-columns:1fr;gap:8px;margin-top:8px}
.reset{background:#f8f9fa}
.help{text-align:center;font-size:12px;color:#d8f3dc;line-height:1.5;margin-top:9px}
@media(min-width:700px){button:hover{filter:brightness(1.08)}}
</style>
</head>
<body>
<main class="game">
<h1>🏏 Auto Shot Cricket</h1>
<div class="score">
<div>Runs<b id="runs">0</b></div>
<div>Wickets<b id="wickets">0/3</b></div>
<div>Target<b id="target">20</b></div>
<div>Level<b id="level">1</b></div>
</div>

<div class="stage">
<canvas id="canvas" width="420" height="640"></canvas>
<div class="timing">
<div>SWING TIMING</div>
<div>EARLY · GOOD · PERFECT · GOOD · LATE</div>
<div class="bar"><span></span><span></span><span></span><span></span><span></span></div>
<div class="marker" id="marker"></div>
</div>
</div>

<div class="message" id="message">Choose a direction when the ball approaches.</div>
<div class="directions">
<button data-shot="left">↙ Front Left</button>
<button data-shot="straight">⬇ Straight</button>
<button data-shot="right">↘ Front Right</button>
</div>
<div class="bottom"><button class="reset" id="reset">↻ Reset Game</button></div>
<div class="help">Tap a direction to automatically swing. PC: Left Arrow, Down Arrow, Right Arrow.<br>No separate HIT button is required.</div>
</main>

<script>
"use strict";
const canvas=document.getElementById("canvas"),ctx=canvas.getContext("2d");
const W=canvas.width,H=canvas.height;
const CONTACT={x:W/2,y:500,radius:43};
const speeds={1:180,2:220,3:260,4:300,5:340};
const $=id=>document.getElementById(id);

let game={
 runs:0,wickets:0,target:20,level:1,
 direction:"straight",phase:"incoming",
 ball:{x:CONTACT.x,y:95,r:10},
 swing:{active:false,progress:0,direction:"straight",startedAt:0},
 hitChecked:false,impact:null,next:0,last:0,over:false,
 deliveryStart:0,deliveryDuration:3000
};

function message(t){$("message").textContent=t}
function score(){
 $("runs").textContent=game.runs;
 $("wickets").textContent=game.wickets+"/3";
 $("target").textContent=game.target;
 $("level").textContent=game.level;
}
function speed(){return speeds[Math.min(game.level,5)] || 340}

function startDelivery(){
 if(game.over)return;
 game.phase="incoming";game.hitChecked=false;game.impact=null;
 game.ball={x:CONTACT.x,y:95,r:10};
 game.swing={active:false,progress:0,direction:game.direction,startedAt:0};
 game.deliveryStart=performance.now();
 game.deliveryDuration=Math.max(1900,3000-(game.level-1)*160);
 message("Ball coming… tap a direction at the right time.");
}

function selectShot(direction){
 if(game.phase!=="incoming" || game.hitChecked || game.over)return;
 game.direction=direction;
 game.swing={active:true,progress:0,direction,startedAt:performance.now()};
 document.querySelectorAll("[data-shot]").forEach(b=>b.classList.toggle("selected",b.dataset.shot===direction));
 message("Swinging "+direction+"…");
}
document.querySelectorAll("[data-shot]").forEach(b=>b.addEventListener("click",()=>selectShot(b.dataset.shot)));

document.addEventListener("keydown",e=>{
 if(e.code==="ArrowLeft"){e.preventDefault();selectShot("left")}
 if(e.code==="ArrowDown"){e.preventDefault();selectShot("straight")}
 if(e.code==="ArrowRight"){e.preventDefault();selectShot("right")}
});

$("reset").addEventListener("click",()=>{
 game={runs:0,wickets:0,target:20,level:1,direction:"straight",phase:"incoming",
 ball:{x:CONTACT.x,y:95,r:10},swing:{active:false,progress:0,direction:"straight",startedAt:0},
 hitChecked:false,impact:null,next:0,last:0,over:false,deliveryStart:0,deliveryDuration:3000};
 score();startDelivery();
});

function timing(){
 const d=game.ball.y-CONTACT.y;
 if(Math.abs(d)<=14)return "perfect";
 if(d>=-43&&d<-14)return "good";
 if(d>14&&d<=43)return "good";
 if(d<-43)return "early";
 return "late";
}

function resolveShot(){
 if(game.hitChecked)return;
 game.hitChecked=true;
 const distance=Math.hypot(game.ball.x-CONTACT.x,game.ball.y-CONTACT.y);
 if(distance>CONTACT.radius){
   game.wickets++;message("MISS! No runs.");finish(false);return;
 }
 const result=timing();
 if(result==="perfect"){
   game.runs+=6;message("PERFECT HIT! +6 RUNS");impact();finish(true);
 }else if(result==="good"){
   const r=Math.random()<.5?2:4;game.runs+=r;
   message("GOOD TIMING! +"+r+" RUNS");impact();finish(true);
 }else{
   message(result==="early"?"TOO EARLY! No runs.":"TOO LATE! No runs.");
   game.wickets++;finish(false);
 }
 score();
}

function impact(){game.impact={x:game.ball.x,y:game.ball.y,time:performance.now()}}
function finish(success){
 game.phase=success?"outgoing":"missed";
 if(game.runs>=game.target){
   game.level++;game.target+=20;
   message("LEVEL COMPLETE! Level "+game.level+" — bowling is faster.");
 }
 if(game.wickets>=3){
   game.over=true;game.phase="over";message("INNINGS OVER! Final score: "+game.runs);return;
 }
 game.next=success?1000:1200;
}

function drawPitch(){
 ctx.fillStyle="#168447";ctx.fillRect(0,0,W,H);
 for(let y=0;y<H;y+=48){ctx.fillStyle=y%96===0?"#ffffff08":"#00000008";ctx.fillRect(0,y,W,48)}
 ctx.fillStyle="#c99b63";ctx.fillRect(86,35,248,565);
 ctx.strokeStyle="#ffffff";ctx.lineWidth=4;
 ctx.beginPath();ctx.moveTo(70,126);ctx.lineTo(350,126);ctx.moveTo(70,512);ctx.lineTo(350,512);ctx.stroke();
 ctx.strokeStyle="#ffe06699";ctx.lineWidth=2;ctx.setLineDash([6,6]);
 ctx.beginPath();ctx.arc(CONTACT.x,CONTACT.y,CONTACT.radius,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
 drawBowler(W/2,78);
}
function drawBowler(x,y){
 ctx.save();ctx.translate(x,y);
 ctx.fillStyle="#23395d";ctx.beginPath();ctx.arc(0,-14,13,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#f2c6a0";ctx.beginPath();ctx.arc(0,-15,8,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#23395d";ctx.fillRect(-13,0,26,32);
 ctx.strokeStyle="#f2c6a0";ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-9,5);ctx.lineTo(-25,20);ctx.moveTo(9,5);ctx.lineTo(25,20);ctx.stroke();
 ctx.fillStyle="#172b4d";ctx.fillRect(-12,30,9,22);ctx.fillRect(3,30,9,22);ctx.restore();
}
function shotAngle(){
 if(game.swing.direction==="left")return -0.75;
 if(game.swing.direction==="right")return 0.75;
 return 0;
}
function drawBatsman(){
 const x=CONTACT.x,y=558;ctx.save();ctx.translate(x,y);
 ctx.strokeStyle="#172b4d";ctx.lineWidth=13;ctx.beginPath();ctx.moveTo(-10,35);ctx.lineTo(-22,78);ctx.moveTo(10,35);ctx.lineTo(22,78);ctx.stroke();
 ctx.fillStyle="#f1f5f9";ctx.fillRect(-35,20,22,49);ctx.fillRect(13,20,22,49);
 ctx.fillStyle="#2563eb";ctx.fillRect(-27,-35,54,65);
 ctx.fillStyle="#f2c6a0";ctx.beginPath();ctx.arc(0,-58,20,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#172b4d";ctx.beginPath();ctx.arc(0,-65,22,Math.PI,Math.PI*2);ctx.fill();ctx.fillRect(-22,-65,44,7);
 ctx.strokeStyle="#f2c6a0";ctx.lineWidth=11;ctx.lineCap="round";ctx.beginPath();
 ctx.moveTo(-18,-20);ctx.lineTo(31,-3);ctx.moveTo(18,-20);ctx.lineTo(34,7);ctx.stroke();
 let a=-0.18;
 if(game.swing.active)a=-0.18+Math.sin(Math.min(1,game.swing.progress)*Math.PI)*shotAngle();
 ctx.save();ctx.translate(33,1);ctx.rotate(a);
 ctx.fillStyle="#6b4226";ctx.fillRect(-5,-55,10,57);
 ctx.fillStyle="#f3d18b";ctx.strokeStyle="#7c4a21";ctx.lineWidth=2;
 ctx.beginPath();ctx.roundRect(-15,-185,30,132,5);ctx.fill();ctx.stroke();
 ctx.fillStyle="#ffffff55";ctx.fillRect(-8,-174,16,110);ctx.restore();
 ctx.fillStyle="#f2c6a0";ctx.beginPath();ctx.arc(31,-3,8,0,Math.PI*2);ctx.arc(34,7,8,0,Math.PI*2);ctx.fill();
 ctx.restore();
}
function drawBall(){
 const b=game.ball;ctx.save();ctx.translate(b.x,b.y);
 ctx.fillStyle="#0003";ctx.beginPath();ctx.ellipse(5,7,13,6,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#d62828";ctx.beginPath();ctx.arc(0,0,b.r,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle="#fff";ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,0,6,-.7,.7);ctx.stroke();ctx.restore();
}
function drawImpact(){
 if(!game.impact)return;
 const p=Math.min(1,(performance.now()-game.impact.time)/420);
 ctx.save();ctx.globalAlpha=1-p;ctx.strokeStyle="#ffe066";ctx.lineWidth=5;
 ctx.beginPath();ctx.arc(game.impact.x,game.impact.y,12+p*34,0,Math.PI*2);ctx.stroke();
 ctx.fillStyle="#fff";ctx.font="bold 18px Arial";ctx.textAlign="center";ctx.fillText("CONTACT!",game.impact.x,game.impact.y-25);ctx.restore();
}
function draw(){
 ctx.clearRect(0,0,W,H);drawPitch();drawBatsman();drawBall();drawImpact();
}
function update(dt){
 if(game.over)return;
 if(game.phase==="incoming"){
   game.ball.y+=speed()*dt/1000;
   if(game.swing.active){
     game.swing.progress+=dt/330;
     // The swing reaches the contact area while the ball is nearby.
     if(game.swing.progress>=1)resolveShot();
   }
   if(game.ball.y>CONTACT.y+75&&!game.hitChecked){
     game.hitChecked=true;game.wickets++;message("MISS! The ball passed the bat.");finish(false);score();
   }
 }else if(game.phase==="outgoing"){
   const dx=game.direction==="left"?-1.8:game.direction==="right"?1.8:0;
   game.ball.x+=dx*speed()*dt/1000;game.ball.y-=speed()*1.2*dt/1000;
 }else if(game.phase==="missed"){
   game.ball.y+=speed()*dt/1000;
 }
 if(game.next>0){
   game.next-=dt;
   if(game.next<=0&&!game.over)startDelivery();
 }
 // Move the timing marker based on ball position.
 const pct=Math.max(0,Math.min(100,(game.ball.y/CONTACT.y)*100));
 $("marker").style.setProperty("--marker",pct+"%");
}
function loop(now){
 if(!game.last)game.last=now;
 const dt=Math.min(40,now-game.last);game.last=now;
 update(dt);draw();requestAnimationFrame(loop);
}
score();startDelivery();requestAnimationFrame(loop);
</script>
</body>
</html>
