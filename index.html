<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>JOY CRICKET WORLD</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow-x:hidden}body{background:#06351f;color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center;padding:8px}.game{width:min(100%,560px);background:#092b20;border:2px solid #ffffff44;border-radius:18px;padding:10px}h1{text-align:center;font-size:clamp(20px,5vw,28px);margin:3px 0 8px}.score{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.score div{background:#102a43;border-radius:8px;text-align:center;padding:5px;font-size:11px}.score b{display:block;color:#ffe066;font-size:18px;margin-top:2px}.stage{position:relative;margin-top:8px;border:3px solid #fff;border-radius:12px;overflow:hidden}.stage canvas{display:block;width:100%;height:auto}.timing{position:absolute;right:6px;top:6px;width:145px;background:#092b20ed;border:1px solid #fff;border-radius:8px;padding:6px;text-align:center;font-size:9px}.bar{display:grid;grid-template-columns:repeat(5,1fr);height:12px;margin-top:4px}.bar span:nth-child(1),.bar span:nth-child(5){background:#e76f51}.bar span:nth-child(2),.bar span:nth-child(4){background:#f4a261}.bar span:nth-child(3){background:#2a9d8f}.marker{height:3px;background:#ffe066;margin-top:5px;position:relative}.marker:after{content:"";position:absolute;width:4px;height:11px;background:#fff;left:var(--marker,50%);top:-4px}.message{text-align:center;color:#ffe066;font-weight:bold;min-height:36px;padding:7px 2px;font-size:15px}.celebrate{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font-size:clamp(36px,11vw,68px);font-weight:900;color:#ffe066;text-shadow:3px 3px #8b1e3f;opacity:0;transform:scale(.5)}.celebrate.show{animation:cheer 1.2s ease-out}.celebrate small{display:block;font-size:15px;color:#fff;text-shadow:none;text-align:center}@keyframes cheer{0%{opacity:0;transform:scale(.5) rotate(-8deg)}25%{opacity:1;transform:scale(1.15) rotate(5deg)}75%{opacity:1;transform:scale(1) rotate(0)}100%{opacity:0;transform:scale(1.3)}}.controls{display:grid;grid-template-columns:1fr;gap:7px}.directions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}button{min-height:48px;border:0;border-radius:10px;background:#d8f3dc;color:#092b20;font-weight:bold;font-size:12px;padding:7px;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible{outline:3px solid #ffe066;outline-offset:2px}button.selected{background:#ffe066;outline:2px solid #fff}.bowl{background:#ffcf33}.reset{background:#f8f9fa}.help{text-align:center;font-size:11px;color:#d8f3dc;line-height:1.4;margin-top:8px}@media(max-width:360px){.timing{width:116px;font-size:8px}button{font-size:11px}}
</style></head><body><main class="game" aria-labelledby="title"><h1 id="title">🏏 JOY CRICKET WORLD</h1><div class="score"><div>Runs<b id="runs">0</b></div><div>Wickets<b id="wickets">0/3</b></div><div>Target<b id="target">20</b></div><div>Level<b id="level">1</b></div></div><div class="stage"><canvas id="canvas" width="420" height="640" aria-label="Cricket pitch with visible batsman, bowler and ball"></canvas><div class="timing">SWING TIMING<div>EARLY · GOOD · PERFECT · GOOD · LATE</div><div class="bar"><span></span><span></span><span></span><span></span><span></span></div><div class="marker" id="marker"></div></div><div id="celebrate" class="celebrate" aria-live="polite"></div></div><div id="message" class="message" role="status">Press BOWL to start the delivery.</div><div class="controls"><button id="bowl" class="bowl">🏏 BOWL / START DELIVERY</button><div class="directions"><button data-shot="left" disabled>↙ FRONT LEFT</button><button data-shot="straight" disabled>⬇ STRAIGHT</button><button data-shot="right" disabled>↘ FRONT RIGHT</button></div><button id="reset" class="reset">↻ RESET GAME</button></div><div class="help">Press BOWL, then tap a shot direction when the ball reaches the yellow contact circle. Keyboard: B to bowl, arrows to hit.</div></main>
<script>
'use strict';const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),W=420,H=640,$=id=>document.getElementById(id),CONTACT={x:210,y:500,radius:45};let game,celebrationTimer=0;
const fresh=()=>({runs:0,wickets:0,target:20,level:1,phase:'ready',ball:{x:210,y:95,r:10},direction:'straight',swing:0,next:0,over:false});game=fresh();
function msg(t){$('message').textContent=t}function score(){$('runs').textContent=game.runs;$('wickets').textContent=game.wickets+'/3';$('target').textContent=game.target;$('level').textContent=game.level}function buttons(enabled){document.querySelectorAll('[data-shot]').forEach(b=>b.disabled=!enabled)}function speed(){return 150+game.level*25}
function bowl(){if(game.over||game.phase==='incoming')return;game.phase='incoming';game.ball={x:210,y:95,r:10};game.swing=0;game.next=0;buttons(true);clear();msg('Ball coming! Time your shot near the yellow circle.')}function clear(){document.querySelectorAll('[data-shot]').forEach(b=>b.classList.remove('selected'))}
$('bowl').addEventListener('click',bowl);$('reset').addEventListener('click',()=>{game=fresh();score();buttons(false);clear();msg('Press BOWL to start the delivery.');$('celebrate').className='celebrate';});
function timing(){const d=game.ball.y-CONTACT.y;if(Math.abs(d)<=13)return'perfect';if(Math.abs(d)<=42)return'good';return d<0?'early':'late'}
function hit(dir){if(game.phase!=='incoming'||game.over)return;game.direction=dir;game.swing=0;clear();document.querySelector('[data-shot="'+dir+'"]').classList.add('selected');const t=timing();let runs=0;if(t==='perfect'){runs=[4,6,6,6,2][Math.floor(Math.random()*5)]}else if(t==='good'){runs=[0,1,2,3,4][Math.floor(Math.random()*5)]}else{runs=[0,0,1][Math.floor(Math.random()*3)]}game.phase='result';buttons(false);if(t==='early'||t==='late'){if(Math.random()<.55){game.wickets++;msg(t.toUpperCase()+'! WICKET LOST.');finish(false);return}}if(runs===0){msg(t.toUpperCase()+' TIMING — DOT BALL');finish(true)}else{game.runs+=runs;msg(t.toUpperCase()+' TIMING — +'+runs+' RUNS');if(runs===4||runs===6)cheer(runs);finish(true)}score()}
document.querySelectorAll('[data-shot]').forEach(b=>b.addEventListener('click',()=>hit(b.dataset.shot)));document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='b')bowl();const m={ArrowLeft:'left',ArrowDown:'straight',ArrowRight:'right'};if(m[e.key]){e.preventDefault();hit(m[e.key])}});
function cheer(r){$('celebrate').innerHTML=(r===6?'SIX!':'FOUR!')+'<small>🎉 GREAT SHOT! 🎉</small>';$('celebrate').className='celebrate show'}function finish(){if(game.runs>=game.target){game.level++;game.target+=20;msg('LEVEL COMPLETE! Level '+game.level+' — faster bowling!');score()}if(game.wickets>=3){game.over=true;game.phase='over';msg('INNINGS OVER! Final score: '+game.runs+'. Press RESET.');return}game.next=1100}
function pitch(){ctx.fillStyle='#168447';ctx.fillRect(0,0,W,H);for(let y=0;y<H;y+=48){ctx.fillStyle=y%96?'#00000008':'#ffffff08';ctx.fillRect(0,y,W,48)}ctx.fillStyle='#c99b63';ctx.fillRect(86,35,248,565);ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(70,126);ctx.lineTo(350,126);ctx.moveTo(70,512);ctx.lineTo(350,512);ctx.stroke();ctx.strokeStyle='#ffe066';ctx.lineWidth=3;ctx.setLineDash([6,6]);ctx.beginPath();ctx.arc(210,500,45,0,Math.PI*2);ctx.stroke();ctx.setLineDash([])}
function bowler(){ctx.save();ctx.translate(210,82);ctx.fillStyle='#183b70';ctx.fillRect(-14,0,28,35);ctx.fillStyle='#f2c6a0';ctx.beginPath();ctx.arc(0,-15,12,0,7);ctx.fill();ctx.strokeStyle='#f2c6a0';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-8,7);ctx.lineTo(-25,25);ctx.moveTo(8,7);ctx.lineTo(25,25);ctx.stroke();ctx.fillStyle='#172b4d';ctx.fillRect(-12,35,9,22);ctx.fillRect(3,35,9,22);ctx.restore()}
function batsman(){const x=210,y=560;ctx.save();ctx.translate(x,y);ctx.fillStyle='#2563eb';ctx.fillRect(-27,-35,54,65);ctx.fillStyle='#f2c6a0';ctx.beginPath();ctx.arc(0,-58,20,0,7);ctx.fill();ctx.fillStyle='#172b4d';ctx.beginPath();ctx.arc(0,-65,22,Math.PI,7);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(-35,20,22,49);ctx.fillRect(13,20,22,49);ctx.strokeStyle='#172b4d';ctx.lineWidth=13;ctx.beginPath();ctx.moveTo(-10,35);ctx.lineTo(-22,78);ctx.moveTo(10,35);ctx.lineTo(22,78);ctx.stroke();ctx.strokeStyle='#f2c6a0';ctx.lineWidth=11;ctx.beginPath();ctx.moveTo(-18,-20);ctx.lineTo(31,-3);ctx.moveTo(18,-20);ctx.lineTo(34,7);ctx.stroke();let a=-.18;if(game.phase==='result')a+=game.direction==='left'?.5:game.direction==='right'?- .5:0;ctx.save();ctx.translate(34,1);ctx.rotate(a);ctx.fillStyle='#6b4226';ctx.fillRect(-5,-55,10,57);ctx.fillStyle='#f3d18b';ctx.strokeStyle='#7c4a21';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(-16,-185,32,132,5);ctx.fill();ctx.stroke();ctx.restore();ctx.restore()}
function ball(){ctx.fillStyle='#d62828';ctx.beginPath();ctx.arc(game.ball.x,game.ball.y,game.ball.r,0,7);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(game.ball.x,game.ball.y,6,-.7,.7);ctx.stroke()}
function draw(){ctx.clearRect(0,0,W,H);pitch();bowler();batsman();ball()}
function update(dt){if(game.phase==='incoming'){game.ball.y+=speed()*dt/1000;if(game.ball.y>545){game.wickets++;game.phase='result';buttons(false);msg('MISSED BALL! WICKET LOST.');finish();score()}}else if(game.phase==='result'){game.ball.y-=speed()*dt/1000;game.ball.x+=(game.direction==='left'?-1:game.direction==='right'?1:0)*speed()*dt/900}if(game.next>0){game.next-=dt;if(game.next<=0&&!game.over){game.phase='ready';msg('Press BOWL for the next delivery.')}}const p=Math.max(0,Math.min(100,game.ball.y/500*100));$('marker').style.setProperty('--marker',p+'%')}
let last=0;function loop(now){const dt=Math.min(40,last?now-last:16);last=now;update(dt);draw();requestAnimationFrame(loop)}score();buttons(false);requestAnimationFrame(loop);
</script></body></html>
